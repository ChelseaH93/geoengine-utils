name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ".[cloud]"
      - run: python -m pytest --cov=geoengine_utils --cov-report=term-missing --cov-fail-under=80 -q
      - run: ruff check src tests
      - run: python -m geoengine_utils.cli ci .geoengine-utils-ci.json --json
